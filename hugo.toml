baseURL = "https://retrosuplex.com/"
locale = "en-us"
title = "Retro Suplex"
enableRobotsTXT = true
pagerSize = 10

[params]
  description = "Retro wrestling game translation patches, and deep dives into how they're made."
  author = "Ken"

[taxonomies]
  tag = "tags"
  series = "series"

[menus]
  [[menus.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menus.main]]
    name = "Patches"
    url = "/patches/"
    weight = 2
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true   # allow raw HTML in posts (your own content only)

[markup.highlight]
  style = "github-dark"
  noClasses = true

[outputs]
  home = ["HTML", "RSS"]

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
