{{- /* Before/after pair: {{< compare before="jp.png" after="en.png" caption="..." >}} */ -}}
{{- $b := .Page.Resources.GetMatch (.Get "before") -}}
{{- $a := .Page.Resources.GetMatch (.Get "after") -}}
<figure class="compare">
  {{ range slice (dict "i" $b "l" "ORIGINAL") (dict "i" $a "l" "PATCHED") }}
  {{ $t := .i.Resize (printf "%dx nearestneighbor webp q92" (cond (gt (mul .i.Width 2) 420) 420 (mul .i.Width 2))) }}
  <div><div class="crt"><a href="{{ .i.RelPermalink }}" title="Click to enlarge"><img class="pixel" loading="lazy" src="{{ $t.RelPermalink }}" alt="{{ .l }}"></a></div><span>{{ .l }}</span></div>
  {{ end }}
  {{ with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
