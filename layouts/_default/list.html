{{ define "main" }}

<section class="lines">{{ partial "index-head.html" . }}{{ range $i, $p := .Paginator.Pages }}{{ partial "line.html" (dict "p" $p "n" (add $i 1)) }}{{ end }}</section>
{{ template "_internal/pagination.html" . }}
{{ end }}
